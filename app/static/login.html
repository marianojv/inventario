<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/styles.css">
  <title>Login</title>
</head>

<body class="login">

  <div class="login-box">
    <h2>Sistemas Pepito</h2>

    <div id="error-msg" class="error"></div>

    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">

    <button id="btn-login" onclick="login()">Ingresar</button>
  </div>

  <script>

    const savedUser = localStorage.getItem("lastUser");

    if (savedUser) {
    user.value = savedUser;
    }


    document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        if (document.activeElement.id === "user" || document.activeElement.id === "pass") {
        login();
        }
    }
    });

    const errorMsg = document.getElementById("error-msg");
    const btnLogin = document.getElementById("btn-login");

    async function login() {

    errorMsg.textContent = "";

    // 🔒 bloquear botón
    btnLogin.disabled = true;
    btnLogin.textContent = "Ingresando...";

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
        username: user.value,
        password: pass.value
        })
    });

    if (!res.ok) {
        const err = await res.json().catch(() => null);
        errorMsg.textContent = err?.detail || "Usuario o contraseña incorrectos";

        // 🔓 reactivar botón
        btnLogin.disabled = false;
        btnLogin.textContent = "Ingresar";

        return;
    }

    const data = await res.json();

    // ✅ guardar usuario
    localStorage.setItem("usuario", JSON.stringify(data));

    localStorage.setItem("lastUser", user.value);

    window.location.href = "/";
    }  
    
  </script>

</body>
</html>
