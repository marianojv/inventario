<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/static/styles.css">
<title>Ventas</title>
</head>

<body>

<div class="ribbon">
    <button onclick="volver()">⬅ Volver</button>
</div>


<h1>Nueva Venta</h1>

<!-- =========================
     CLIENTE
========================= -->
<div class="cliente-box">

<div class="row">
    <label>Código Cliente</label>
    <input id="cliente_codigo" list="clientes" autocomplete="off">
    <datalist id="clientes"></datalist>

    <button onclick="abrirModalCliente()">Crear Cliente</button>
</div>

<div class="row">
    <label>Cliente</label>
    <input id="cliente_nombre" readonly>
</div>

</div>

<!-- =========================
     PRODUCTOS
========================= -->
<input
    id="producto"
    list="productos"
    placeholder="Buscar producto por nombre o código"
    autocomplete="off"
/>
<datalist id="productos"></datalist>

<table>
<thead>
<tr>
    <th>Código</th>
    <th>Producto</th>
    <th class="num">Precio</th>
    <th class="num">Cantidad</th>
    <th class="num">Subtotal</th>
</tr>
</thead>

<tbody id="detalle"></tbody>

<tfoot>
<tr>
    <td colspan="4">Total</td>
    <td class="num">$<span id="total">0.00</span></td>
</tr>
</tfoot>
</table>

<button onclick="confirmarVenta()">Confirmar venta</button>

<!-- =========================
     MODAL CLIENTE
========================= -->
<div class="modal" id="modalCliente">
<div class="modal-content">

<h2>Alta de Cliente</h2>

<div class="form-row">
    <label>Tipo</label>
    <div>
        <input type="radio" name="tipo" value="EMPRESA" checked onchange="cambiarTipo()"> Empresa
        <input type="radio" name="tipo" value="PERSONA" onchange="cambiarTipo()"> Persona
    </div>
</div>

<div class="form-row empresa">
    <label>Código Fiscal *</label>
    <input id="codigo_fiscal">
</div>

<div class="form-row persona hidden">
    <label>DNI</label>
    <input id="dni">
</div>

<div class="form-row">
    <label>Nombre / Razón Social *</label>
    <input id="nombre_razon">
</div>

<div class="form-row">
    <label>Teléfono</label>
    <input id="telefono">
</div>

<div class="form-row">
    <label>Calle</label>
    <input id="calle">
</div>

<div class="form-row">
    <label>Número</label>
    <input id="numero">
</div>

<div class="form-row">
    <label>Localidad</label>
    <input id="localidad">
</div>

<div class="form-row">
    <label>CP</label>
    <input id="codigo_postal">
</div>

<div class="form-row">
    <button onclick="guardarCliente()">Guardar</button>
    <button onclick="cerrarModalCliente()">Cancelar</button>
</div>

</div>
</div>

<script>
/*const buscarClientesUrl = "http://127.0.0.1:8000/clientes/buscar";
const crearClienteUrl = "http://127.0.0.1:8000/clientes";
const buscarProductosUrl = "http://127.0.0.1:8000/productos/buscar";
const ventasUrl = "http://127.0.0.1:8000/ventas";*/

const crearClienteUrl = "/clientes";
const buscarClientesUrl = "/clientes/buscar";
const buscarProductosUrl = "/productos/buscar";
const ventasUrl = "/ventas";

const detalle = document.getElementById("detalle");
const totalSpan = document.getElementById("total");

let clienteActual = null;
let clientesCache = [];
let productosCache = [];
let detalles = [];

/* =========================
   CLIENTES
========================= */

cliente_codigo.addEventListener("input", async () => {
    const q = cliente_codigo.value.trim();
    if (q.length < 2) return;

    const res = await fetch(`${buscarClientesUrl}?q=${encodeURIComponent(q)}`, {
        headers: {
            "x-user-id": JSON.parse(localStorage.getItem("usuario")).id,
            "x-user-rol": JSON.parse(localStorage.getItem("usuario")).rol
        }
    });
    const clientes = await res.json();

    clientesCache = clientes;
    clientes.innerHTML = "";

    clientes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = `${c.codigo_cliente} - ${c.nombre_razon_social}`;
        opt.dataset.codigo_cliente = c.codigo_cliente;
        document.getElementById("clientes").appendChild(opt);
    });
});

cliente_codigo.addEventListener("change", () => {
    const val = cliente_codigo.value;
    const c = clientesCache.find(x =>
        `${x.codigo_cliente} - ${x.nombre_razon_social}` === val
    );
    if (!c) return;

    clienteActual = c;
    cliente_nombre.value = c.nombre_razon_social;
});

/* =========================
   PRODUCTOS (igual que antes)
========================= */

producto.addEventListener("input", async () => {
    const q = producto.value.trim();
    if (q.length < 2) return;

    const res = await fetch(`${buscarProductosUrl}?q=${encodeURIComponent(q)}`, {
        headers: {
            "x-user-id": JSON.parse(localStorage.getItem("usuario")).id,
            "x-user-rol": JSON.parse(localStorage.getItem("usuario")).rol
        }
    });
    const productos = await res.json();

    productosCache = productos;
    productos.innerHTML = "";

    productos.forEach(p => {
        const opt = document.createElement("option");
        opt.value = `${p.codigo} ${p.nombre}`;
        opt.dataset.id = p.id;
        document.getElementById("productos").appendChild(opt);
    });
});

producto.addEventListener("change", () => {
    const val = producto.value;
    const p = productosCache.find(x => `${x.codigo} ${x.nombre}` === val);
    if (!p) return;

    agregarProducto(p, 1);
    producto.value = "";
});

/* =========================
   CARRITO
========================= */

function agregarProducto(p, cant) {
    const ex = detalles.find(d => d.producto_id === p.id);
    if (ex) ex.cantidad += cant;
    else detalles.push({
        producto_id: p.id,
        codigo: p.codigo,
        nombre: p.nombre,
        precio: p.precio,
        stock: p.stock,          // ✅ volver a guardar stock
        cantidad: cant
    });
    render();
}

function render() {
    detalle.innerHTML = "";
    let total = 0;

    detalles.forEach((d,i) => {
        const sub = d.precio * d.cantidad;
        total += sub;

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${d.codigo}</td>
            <td>${d.nombre}</td>
            <td class="num">$${d.precio.toFixed(2)}</td>
            <td class="num">
              <input
                type="number"
                min="1"
                value="${d.cantidad}"
                onchange="cambiarCantidad(${i}, this.value)"
                onblur="cambiarCantidad(${i}, this.value)"
                >
            </td>
            <td class="num">$${sub.toFixed(2)}</td>
        `;
        detalle.appendChild(tr);
    });

    totalSpan.textContent = total.toFixed(2);
}

/* =========================
   VALIDAR VENTA
========================= */

async function confirmarVenta() {
    if (!clienteActual) {
        alert("Debe seleccionar un cliente");
        return;
    }

    if (!detalles.length) {
        alert("No hay productos");
        return;
    }

    const payload = {
        cliente_id: clienteActual.id,
        detalles: detalles.map(d => ({
            producto_id: d.producto_id,
            cantidad: d.cantidad
        }))
    };

    const res = await fetch(ventasUrl, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-user-id": JSON.parse(localStorage.getItem("usuario")).id,
            "x-user-rol": JSON.parse(localStorage.getItem("usuario")).rol
        },
        body: JSON.stringify(payload)
    });

    if (!res.ok) {
        const err = await res.json();
        alert(err.detail || "Error al registrar la venta");
        return;
    }

    const data = await res.json();

    alert(`Venta registrada correctamente\nTotal: $${data.total}`);

    // Reset de la venta
    detalles = [];
    clienteActual = null;
    cliente_codigo.value = "";
    cliente_nombre.value = "";
    render();
}

/* =========================
   MODAL CLIENTE
========================= */

function abrirModalCliente() {
    modalCliente.style.display = "block";
}
function cerrarModalCliente() {
    modalCliente.style.display = "none";
}
function cambiarTipo() {
    const tipo = document.querySelector("input[name=tipo]:checked").value;
    document.querySelector(".empresa").style.display = tipo === "EMPRESA" ? "flex" : "none";
    document.querySelector(".persona").style.display = tipo === "PERSONA" ? "flex" : "none";
}
async function guardarCliente() {
    const tipo = document.querySelector("input[name=tipo]:checked").value;

    const payload = {
        tipo_cliente: tipo,
        nombre_razon_social: nombre_razon.value,
        telefono: telefono.value,
        calle: calle.value,
        numero: numero.value,
        localidad: localidad.value,
        codigo_postal: codigo_postal.value,
        codigo_fiscal: tipo === "EMPRESA" ? codigo_fiscal.value : null,
        dni: tipo === "PERSONA" ? dni.value : null
    };

    const res = await fetch(crearClienteUrl, {
        method:"POST",
        headers: {
            "Content-Type": "application/json",
            "x-user-id": JSON.parse(localStorage.getItem("usuario")).id,
            "x-user-rol": JSON.parse(localStorage.getItem("usuario")).rol
        },
        body: JSON.stringify(payload)
    });


    if (!res.ok) {
        const err = await res.json();
        alert(err.detail || "Error al crear cliente");
        return;
    }


    const c = await res.json();
    clienteActual = c;
    cliente_codigo.value = `${c.codigo_cliente} - ${c.nombre_razon_social}`;
    cliente_nombre.value = c.nombre_razon_social;

    cerrarModalCliente();
}

function cambiarCantidad(index, valor) {
    const cantidad = parseInt(valor);
    const item = detalles[index];

    if (isNaN(cantidad) || cantidad <= 0) {
        render();
        return;
    }

    if (cantidad > item.stock) {
        alert(`Stock disponible: ${item.stock} unidades`);
        render();   // vuelve al valor válido
        return;
    }

    item.cantidad = cantidad;
    render();
}

function volver() {
    window.location.href = "/";
}

</script>

</body>
</html>
